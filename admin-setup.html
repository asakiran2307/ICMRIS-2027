<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICMRIS–2027 | Initial Admin Setup</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6fb;color:#172044;font:15px Arial,sans-serif;padding:20px}.card{width:min(480px,100%);background:white;padding:30px;border:1px solid #e0e5f0;border-radius:18px;box-shadow:0 18px 55px #17204415}h1{font-size:25px;margin:0 0 8px;color:#850019}p{color:#64708b;line-height:1.5;font-size:13px}label{display:block;font-weight:700;font-size:12px;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d8dfed;border-radius:8px;font-size:14px}button{margin-top:18px;border:0;border-radius:24px;background:#a50020;color:white;padding:13px 20px;font-weight:700;cursor:pointer;width:100%}.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:13px}.ok{background:#eaf8f0;color:#17633c}.err{background:#fff0f1;color:#9d1730}.warn{background:#fff6e7;color:#825b19}
</style></head><body><main class="card"><h1>ICMRIS–2027 Admin Setup</h1><p>Create the first conference administrator. This one-time setup closes automatically after the first admin account is created.</p><div class="msg warn">Keep the bootstrap secret private. Do not share your administrator password.</div>
<form id="setup"><label>Bootstrap secret</label><input name="bootstrapSecret" type="password" autocomplete="off" required><label>Administrator name</label><input name="fullName" required minlength="2"><label>Administrator email</label><input name="email" type="email" required><label>Create password (minimum 12 characters)</label><input name="password" type="password" minlength="12" required autocomplete="new-password"><button>Create first administrator</button></form><div id="result"></div><p><a href="/">Return to ICMRIS–2027</a></p></main>
<script>
document.getElementById("setup").addEventListener("submit",async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries()),n=document.getElementById("result");try{const r=await fetch("/api/admin/bootstrap",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(f)}),raw=await r.text();let d;try{d=raw?JSON.parse(raw):{}}catch{d={error:"Server returned a non-JSON response (HTTP "+r.status+"). "+raw.slice(0,220)}}if(!r.ok)throw Error(d.error||("Setup failed (HTTP "+r.status+")."));n.className="msg ok";n.textContent="Administrator created. Your secure session is active. You can now return to the conference portal and sign in.";e.target.reset()}catch(x){n.className="msg err";n.textContent=x.message}});
</script></body></html>
